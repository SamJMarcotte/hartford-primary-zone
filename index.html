<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zone Pay Lookup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
      background-color: #f4f4f9;
      color: #333;
    }
    input {
      width: 300px;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #007BFF;
      border-radius: 5px;
      outline: none;
    }
    input:focus {
      border-color: #0056b3;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
    .zone-list {
      text-align: left;
      margin: 20px auto;
      width: 70%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .zone {
      padding: 15px;
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .zone:hover {
      transform: scale(1.02);
    }
    .zone h4 {
      margin-bottom: 10px;
      color: #007BFF;
    }
    .zone p {
      white-space: pre-line;
      color: #555;
    }
  </style>
</head>
<body>

  <h2>Zone Pay Lookup</h2>
  <input type="text" id="locationInput" placeholder="Enter a town..." list="towns" />
  <datalist id="towns"></datalist>
  <div id="result"></div>

  <h3>Zones and Their Towns</h3>
  <div id="zoneLists" class="zone-list"></div>

  <script>
    let zones = {};

    fetch('zones.json')
      .then(response => response.json())
      .then(data => {
        zones = data;
        populatePage();
      });

    function populatePage() {
      const datalist = document.getElementById("towns");
      const zoneLists = document.getElementById("zoneLists");

      // Populate town list for autocomplete
      Object.values(zones).forEach(zone => {
        zone.towns.forEach(town => {
          let option = document.createElement("option");
          option.value = town;
          datalist.appendChild(option);
        });
      });

      // Display all zones and their towns
      Object.entries(zones).forEach(([zoneName, zoneData]) => {
        let zoneDiv = document.createElement("div");
        zoneDiv.classList.add("zone");
        zoneDiv.innerHTML = `<h4>${zoneName} - ${zoneData.pay}</h4><p>${zoneData.towns.join(", ")}</p>`;
        zoneLists.appendChild(zoneDiv);
      });
    }

    document.getElementById("locationInput").addEventListener("change", function () {
      const input = this.value;
      let zoneName = "Unknown Zone";
      let pay = "N/A";

      for (let [zone, data] of Object.entries(zones)) {
        if (data.towns.includes(input)) {
          zoneName = zone;
          pay = data.pay;
          break;
        }
      }

      document.getElementById("result").innerHTML = `<strong>${input}</strong> is in <strong>${zoneName}</strong> and worth <strong>${pay}</strong>`;
    });
  </script>
</body>
</html>
