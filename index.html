:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a2a3d;background:#f1f5f9}

header{background:#13253c;color:white;padding:25px 20px 82px}.wrap{max-width:1150px;margin:auto}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;color:#9bc6f4;text-transform:uppercase}

input:focus{border-color:#2778cb;box-shadow:0 0 0 3px #2778cb20}
.results{display:grid;gap:7px;margin-top:10px}.result{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid #dce5ef;border-radius:9px;background:#f8fbff;padding:12px;text-align:left}

svg{display:block;width:100%;height:auto;max-height:650px;min-height:260px}

#ctMap.labels-close .town-label.small-town{opacity:1}
.town-label.dim{opacity:.14!important}
.town-label.selected-label{fill:#09182d;stroke:#fff;stroke-width:3.5px}

.town-button{border:1px solid #dce5ef;background:#f8fbff;text-align:left;padding:10px 12px;border-radius:9px}
footer{color:#667b91;text-align:center;font-size:12px;padding:4px 15px 25px}
@media(max-width:650px){.panel{padding:15px}.zone-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.zone-card:last-child{grid-column:span 2}.map-shell svg{min-height:200px}.town-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
